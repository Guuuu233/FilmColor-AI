[project]
name = "filmcolor"
version = "0.0.1"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "rawpy",
    "tifffile",
    "exifread",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filmcolor"]
