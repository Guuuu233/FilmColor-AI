[project]
name = "filmcolor"
version = "0.0.1"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "rawpy",
    "tifffile",
    "exifread",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest",
]
ml = [
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filmcolor"]

[tool.hatch.build.targets.wheel.force-include]
"data/manifests" = "filmcolor/_manifests"
