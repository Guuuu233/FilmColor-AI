<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>FilmColor</title>
<style>
  :root { --bg:#1d1d1f; --panel:#26262a; --fg:#e6e6e6; --dim:#9a9aa0; --acc:#e0a040; --warn:#ff8a65; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px -apple-system, "PingFang SC", sans-serif;
         display:grid; grid-template-columns: 270px 1fr 310px; height:100vh; }
  aside, section { overflow:auto; }
  #files { background:var(--panel); padding:8px; }
  #files .f { padding:3px 6px; cursor:pointer; border-radius:3px; display:flex; justify-content:space-between; gap:6px; align-items:center; }
  #files .f .fn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #files .f .tag { font-size:11px; color:var(--dim); white-space:nowrap; }
  #files .f .tag.warn { color:var(--warn); font-weight:600; }
  #files .f:hover { background:#333; }
  #files .f.on { background:var(--acc); color:#000; }
  #files .f.on .tag, #files .f.on .tag.warn { color:#000; }
  #main { display:flex; flex-direction:column; }
  #bar { display:flex; gap:6px; padding:6px; background:var(--panel); align-items:center; flex-wrap:wrap; }
  button, select { background:#3a3a40; color:var(--fg); border:1px solid #555; border-radius:4px; padding:4px 9px; cursor:pointer; }
  button.on { background:var(--acc); color:#000; } button:disabled { opacity:.4; cursor:default; }
  #stage { flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #wrap { position:relative; max-width:100%; max-height:100%; }
  #img { display:block; max-width:100%; max-height:calc(100vh - 90px); user-select:none; -webkit-user-drag:none; }
  #ov { position:absolute; left:0; top:0; width:100%; height:100%; cursor:crosshair; }
  #status { padding:4px 8px; color:var(--dim); background:var(--panel); min-height:22px; }
  #side { background:var(--panel); padding:10px; }
  .row { margin:8px 0; } .row label { display:flex; justify-content:space-between; color:var(--dim); }
  input[type=range] { width:100%; }
  .box { margin-top:12px; padding:8px; background:#1f1f22; border-radius:4px; line-height:1.6; }
  .warn { color:var(--warn); }
  #crop { position:fixed; inset:30px; background:#000c; display:none; align-items:center; justify-content:center; flex-direction:column; }
  #crop img { max-width:95%; max-height:85%; image-rendering:pixelated; }
  @media (max-width: 1000px) { body { grid-template-columns: 1fr; height:auto; } #files { max-height:160px; } #img { max-height:70vh; } }
</style>
</head>
<body>
<aside id="files">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <span style="color:var(--dim)">负片（RAW / DNG）</span>
    <button id="bScanRoll" style="padding:2px 6px;font-size:11px">分析整卷片基</button>
  </div>
  <div id="rollSummary" style="font-size:11px;color:var(--dim);margin-bottom:6px"></div>
  <div id="list"></div>
</aside>
<section id="main">
  <div id="bar">
    <select id="film"><option value="color">彩色负片</option><option value="bw">黑白负片</option></select>
    <button id="bPos" class="on">正片</button><button id="bNeg">负片</button>
    <span style="width:8px"></span>
    <button id="bAuto">自动参数</button><button id="bReset">重置</button>
    <span style="width:8px"></span>
    <span style="color:var(--dim);font-size:12px">片基：</span>
    <button id="bAutoBase" class="on" title="① 本帧自动片基（B0，默认）">① 本帧 B0</button>
    <button id="bPick" title="② 在预览图上拖拽框选未曝光片边/片基（Manual）">② 框选片边</button>
    <button id="bRollDQ" title="③ 整卷片基色度 + 48×48 全幅块分位数解耦黑点（DQ(c_roll)）">③ 整卷解耦 DQ</button>
    <button id="bRollB1" title="④ 整卷完整片基向量（B1）">④ 整卷 B1</button>
    <span style="width:8px"></span>
    <button id="b11">1:1 局部</button>
    <span style="flex:1"></span>
    <button id="bExport">导出 16 位 TIFF</button>
  </div>
  <div id="stage"><div id="wrap"><img id="img" alt=""><canvas id="ov"></canvas></div></div>
  <div id="status">选择左侧的一张负片。预览是缩小后的近似；用“1:1 局部”检查饱和与裁切。</div>
</section>
<aside id="side"><div id="sliders"></div><div class="box" id="info">未打开照片</div><div class="box" id="exp" style="display:none"></div></aside>
<div id="crop"><img id="cropImg" alt=""><div style="margin-top:8px"><span id="cropInfo"></span> <button id="cropClose">关闭</button></div></div>
<script>
const $ = id => document.getElementById(id);
const NAMES = {ev:"曝光 ev", temp:"色温（暖 +）", tint:"色调（品 +）", sat:"饱和度", contrast:"反差", midtone:"中灰", shoulder:"高光肩部"};
const STEP = {ev:0.05, temp:0.02, tint:0.02, sat:0.02, contrast:0.02, midtone:0.005, shoulder:0.01};
const BASE_LABELS = {auto:"① 本帧自动（B0）", manual:"② 手动框选区域（Manual）", roll_dq:"③ 整卷色度 + 解耦黑点（DQ(c_roll)）", roll_b1:"④ 整卷完整片基（B1）"};
let meta = null, params = {}, mode = "pos", tool = null, seq = 0, timer = null, drag = null, busy = false;
let rollData = {}, currentRel = null;
const DEP = ["bPos", "bNeg", "bAuto", "bReset", "bPick", "bAutoBase", "bRollDQ", "bRollB1", "b11", "bExport", "film"];
// while a photo is loading (or the base is re-estimated) nothing may act on the previous one
function setBusy(b) { busy = b; for (const id of DEP) $(id).disabled = b; document.querySelectorAll("#sliders input").forEach(x => x.disabled = b); $("list").style.pointerEvents = b ? "none" : ""; }
function tok() { return meta ? meta.token : ""; }
function folderOf(rel) { const i = rel ? rel.lastIndexOf("/") : -1; return i >= 0 ? rel.slice(0, i) : "."; }

async function api(path, body) {
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const ct = r.headers.get("Content-Type") || "";
  if (ct.startsWith("application/json")) {
    const j = await r.json();
    if (r.status === 409) throw new Error("这张图已在别的窗口被换掉或源文件已改动，请在本窗口重新打开（" + j.error + "）");
    if (!r.ok) throw new Error(j.error); return j;
  }
  if (!r.ok) throw new Error(r.status);
  return r;
}
function status(t, warn) { $("status").textContent = t; $("status").className = warn ? "warn" : ""; }
function pq() { const p = {}; for (const k in NAMES) p[k] = params[k]; return "token=" + tok() + "&p=" + encodeURIComponent(JSON.stringify(p)); }

function syncBaseButtons() {
  const m = meta && meta.base ? meta.base.method : null;
  $("bAutoBase").classList.toggle("on", m === "auto");
  $("bPick").classList.toggle("on", tool === "pick" || m === "manual");
  $("bRollDQ").classList.toggle("on", m === "roll_dq");
  $("bRollB1").classList.toggle("on", m === "roll_b1");
}

function updateFileBadges() {
  document.querySelectorAll("#list .f").forEach(el => {
    const rel = el.dataset.rel;
    const fd = rollData[folderOf(rel)];
    const fr = fd && fd.frames ? fd.frames[rel] : null;
    const tag = el.querySelector(".tag");
    if (!fr) { tag.textContent = ""; tag.className = "tag"; return; }
    if (fr.own_error) {
      tag.textContent = "B0失败!";
      tag.className = "tag warn";
    } else if (fr.chroma_part != null) {
      const dc = fr.chroma_part, dl = fr.level_diff;
      const hi = dc >= 0.1 || (fr.inside_image != null && fr.inside_image > 0.5);
      tag.textContent = `ΔC ${dc.toFixed(2)}${hi ? "!" : ""}`;
      tag.title = `相对整卷片基：色度差 ΔC = ${dc.toFixed(3)} D，水平差 Δℓ = ${dl >= 0 ? "+" : ""}${dl.toFixed(3)} D`;
      tag.className = hi ? "tag warn" : "tag";
    }
  });
}

async function scanRoll(folder) {
  folder = folder || (currentRel ? folderOf(currentRel) : ".");
  $("bScanRoll").disabled = true;
  $("rollSummary").textContent = `正在计算整卷片基（${folder}）……`;
  try {
    const j = await api("/api/roll?folder=" + encodeURIComponent(folder));
    rollData[folder] = j;
    if (j.roll) {
      const nWarn = Object.values(j.frames).filter(x => x.flag).length;
      $("rollSummary").innerHTML = `整卷片基已就绪（${j.n_files} 帧，采用 ${j.roll.used.join(", ")}）` +
        (nWarn ? `<br><span class="warn">提示：${nWarn} 帧 ΔC ≥ 0.10 D 或片基在画面内</span>` : "");
    } else {
      $("rollSummary").innerHTML = `<span class="warn">整卷片基不可用：${j.error || "未知"}</span>`;
    }
    updateFileBadges();
    if (meta) showInfo();
  } catch (e) {
    $("rollSummary").innerHTML = `<span class="warn">整卷计算失败：${e.message}</span>`;
  } finally {
    $("bScanRoll").disabled = false;
  }
}

async function loadFiles() {
  const j = await api("/api/files");
  $("list").innerHTML = "";
  if (!j.files.length) { $("list").textContent = "（没有可打开的文件）"; return; }
  for (const f of j.files) {
    const d = document.createElement("div"); d.className = "f"; d.dataset.rel = f; d.title = f;
    d.innerHTML = `<span class="fn">${f}</span><span class="tag"></span>`;
    d.onclick = () => openFile(f, d); $("list").appendChild(d);
  }
  // Auto-compute roll base in the background when the root folder is a single roll (<= 60 files)
  const folders = new Set(j.files.map(folderOf));
  if (folders.size === 1 && j.files.length >= 2 && j.files.length <= 60) {
    scanRoll([...folders][0]);
  }
}

async function openFile(f, el, baseMode) {
  document.querySelectorAll(".f").forEach(x => x.classList.remove("on"));
  if (!el) el = [...document.querySelectorAll(".f")].find(x => x.dataset.rel === f);
  if (el) el.classList.add("on");
  currentRel = f;
  baseMode = baseMode || "auto";
  status(`正在解码、估计片基（${BASE_LABELS[baseMode] || baseMode}）、反转……`);
  const same = meta && meta.path === f;
  setBusy(true); ++seq;  // responses of earlier requests are dropped
  try { meta = await api("/api/open", {path:f, film:$("film").value, base_mode:baseMode}); }
  catch (e) {
    meta = null; $("img").removeAttribute("src"); setBusy(false); syncBaseButtons();
    $("info").innerHTML = `<b>${f}</b><br><span class="warn">本帧自动片基失败：${e.message}</span><br>可点击上方 <b>③ 整卷解耦 DQ</b> 或 <b>④ 整卷 B1</b> 使用整卷片基打开。`;
    status("打不开（可切换至 ③ 整卷解耦 DQ 或 ④ 整卷 B1 重试）：" + e.message, true);
    return;
  }
  setBusy(false); syncBaseButtons();
  // a different photo starts from the defaults; re-opening the same one (film switch) keeps the sliders
  if (!same || !Object.keys(params).length) params = Object.assign({}, meta.defaults);
  buildSliders(); showInfo(); refresh(); status("已打开 " + meta.path);
}
function buildSliders() {
  const box = $("sliders"); box.innerHTML = "";
  for (const k in NAMES) {
    const [lo, hi] = meta.sliders[k];
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<label><span>${NAMES[k]}</span><span id="v_${k}"></span></label>
      <input type="range" id="s_${k}" min="${lo}" max="${hi}" step="${STEP[k]}" value="${params[k]}">`;
    box.appendChild(row);
    const s = row.querySelector("input");
    s.oninput = () => { params[k] = parseFloat(s.value); $("v_" + k).textContent = params[k].toFixed(3); schedule(); };
    $("v_" + k).textContent = Number(params[k]).toFixed(3);
  }
}
function setParams(p) { for (const k in NAMES) params[k] = p[k]; buildSliders(); refresh(); }
function schedule() { clearTimeout(timer); timer = setTimeout(refresh, 90); }
async function refresh() {
  if (!meta || busy) return;
  const my = ++seq, token = tok();
  try {
    const r = await api(mode === "pos" ? "/api/render?" + pq() : "/api/negative?token=" + token);
    if (my !== seq || token !== tok()) return;  // a newer request or another photo superseded this one
    const blob = await r.blob(); const url = URL.createObjectURL(blob);
    const old = $("img").src; $("img").src = url; if (old.startsWith("blob:")) URL.revokeObjectURL(old);
    if (mode === "pos") {
      const bb = parseFloat(r.headers.get("X-Below-Black")), ch = parseFloat(r.headers.get("X-Clip-High"));
      $("stats").innerHTML = `画面区域内，按预览像素统计<br>黑点以下（至少一个通道）：<span class="${bb > 0.1 ? "warn" : ""}">${(bb*100).toFixed(2)}%</span><br>` +
        `高光裁切（至少一个通道）：<span class="${ch > 0.005 ? "warn" : ""}">${(ch*100).toFixed(2)}%</span>`;
    }
  } catch (e) { if (my === seq) status("渲染失败：" + e.message, true); }
  $("img").onload = drawOverlay;
}
function showInfo() {
  const b = meta.base, w = b.warnings || [];
  const fd = rollData[folderOf(meta.path)];
  const fr = fd && fd.frames ? fd.frames[meta.path] : null;
  const dc = b.chroma_part != null ? b.chroma_part : (fr ? fr.chroma_part : null);
  const dl = b.level_diff != null ? b.level_diff : (fr ? fr.level_diff : null);
  let rollLine = "";
  if (dc != null && dl != null) {
    const warnC = dc >= 0.1;
    rollLine = `<br>相对整卷片基：色度差 ΔC = <span class="${warnC ? "warn" : ""}">${dc.toFixed(3)} D</span>，` +
      `水平差 Δℓ = ${dl >= 0 ? "+" : ""}${dl.toFixed(3)} D` +
      (warnC && b.method === "auto" ? `<br><span class="warn">提示：ΔC ≥ 0.10 D（本帧片基可能误取有色景物），建议点「③ 整卷解耦 DQ」对比</span>` : "");
  }
  const dloLine = b.d_lo_shared != null ? `<br>解耦共享黑点 d_lo：${b.d_lo_shared.toFixed(3)} D（48×48 全幅块 0.1%）` : "";
  $("info").innerHTML = `<b>${meta.path}</b><br>胶片：${meta.film === "bw" ? "黑白" : "彩色"}；预览 ${meta.preview_shape[1]}×${meta.preview_shape[0]}（1/${meta.factor}）<br>` +
    `片基模式：<b>${BASE_LABELS[b.method] || b.method}</b>` +
    (b.inside_image != null ? `<br>B0 候选块在画面内 ${(b.inside_image*100).toFixed(0)}%` + (b.inside_image > 0.5 ? ` <span class="warn">（可能没有片边，片基可能落在景物上）</span>` : "") : "") +
    rollLine + dloLine +
    (w.length ? `<br><span class="warn">片基警告：${w.join("；")}</span>` : "") +
    `<br>自动参数：${meta.auto ? meta.auto.status + (meta.auto.flags && meta.auto.flags.length ? "（" + meta.auto.flags.join("，") + "）" : "") : "无"}` +
    `<div id="stats" style="margin-top:6px"></div>`;
}
function drawOverlay() {
  const c = $("ov"), im = $("img"); c.width = im.clientWidth; c.height = im.clientHeight;
  const g = c.getContext("2d"); g.clearRect(0, 0, c.width, c.height);
  if (!meta) return;
  const sx = c.width / meta.preview_shape[1], sy = c.height / meta.preview_shape[0];
  g.strokeStyle = "#40e0ff"; g.lineWidth = 2;
  for (const [t, l, h, w] of meta.base.regions_preview) g.strokeRect(l * sx, t * sy, w * sx, h * sy);
  if (drag) { g.strokeStyle = "#e0a040"; g.strokeRect(drag.x0, drag.y0, drag.x1 - drag.x0, drag.y1 - drag.y0); }
}
function toPreview(ev) {
  const r = $("ov").getBoundingClientRect();
  return [(ev.clientX - r.left) * meta.preview_shape[1] / r.width, (ev.clientY - r.top) * meta.preview_shape[0] / r.height, ev.clientX - r.left, ev.clientY - r.top];
}
// picking and 1:1 work on the positive view only (the negative view is the camera's own JPEG, not sensor-aligned)
$("ov").onmousedown = ev => { if (!meta || tool !== "pick" || mode !== "pos") return; const [, , x, y] = toPreview(ev); drag = {x0:x, y0:y, x1:x, y1:y}; };
$("ov").onmousemove = ev => { if (!drag) return; const [, , x, y] = toPreview(ev); drag.x1 = x; drag.y1 = y; drawOverlay(); };
$("ov").onmouseup = async ev => {
  if (!meta || mode !== "pos") { drag = null; return; }
  if (tool === "11") { const [px, py] = toPreview(ev); return showCrop(px, py); }
  if (!drag) return;
  const r = $("ov").getBoundingClientRect(), s = meta.preview_shape[1] / r.width;
  const l = Math.round(Math.min(drag.x0, drag.x1) * s), t = Math.round(Math.min(drag.y0, drag.y1) * s);
  const w = Math.round(Math.abs(drag.x1 - drag.x0) * s), h = Math.round(Math.abs(drag.y1 - drag.y0) * s);
  drag = null;
  if (w < 2 || h < 2) { drawOverlay(); return; }
  status("用框选区域重新估计片基并反转……");
  setBusy(true); ++seq;
  try {
    const m = await api("/api/base", {region:[t, l, h, w], token:tok()});
    meta = m; tool = null; setBusy(false); syncBaseButtons(); showInfo(); refresh(); status("片基：② 手动框选区域");
  } catch (e) { setBusy(false); syncBaseButtons(); status("片基设置失败：" + e.message, true); drawOverlay(); }
};
async function showCrop(px, py) {
  const size = 600, f = meta.factor;
  const t = Math.max(0, Math.round(py * f - size / 2)), l = Math.max(0, Math.round(px * f - size / 2));
  status("渲染 1:1 局部……");
  try {
    const r = await api(`/api/crop?t=${t}&l=${l}&size=${size}&${pq()}`);
    $("cropImg").src = URL.createObjectURL(await r.blob());
    $("cropInfo").textContent = `传感器像素 (${t}, ${l})，${size}×${size}，与导出图同一像素`;
    $("crop").style.display = "flex"; status("1:1 局部");
  } catch (e) { status("1:1 失败：" + e.message, true); }
}
function setTool(t) { tool = tool === t ? null : t; syncBaseButtons(); $("b11").classList.toggle("on", tool === "11"); }
$("bPick").onclick = () => setTool("pick");
$("b11").onclick = () => setTool("11");
$("bScanRoll").onclick = () => scanRoll();
$("cropClose").onclick = () => { $("crop").style.display = "none"; };
$("bPos").onclick = () => { mode = "pos"; $("bPos").classList.add("on"); $("bNeg").classList.remove("on"); refresh(); };
$("bNeg").onclick = () => { mode = "neg"; $("bNeg").classList.add("on"); $("bPos").classList.remove("on"); refresh(); };
$("bAuto").onclick = () => { if (meta && meta.auto) setParams(meta.auto.params); };
$("bReset").onclick = () => { if (meta) setParams(meta.defaults); };

async function switchBaseMode(bm) {
  tool = null;
  if (!meta && currentRel) { return openFile(currentRel, null, bm); }
  if (!meta) return;
  status(`切换片基模式：${BASE_LABELS[bm]}……`);
  setBusy(true); ++seq;
  try {
    const m = await api("/api/base", {mode:bm, token:tok()});
    meta = m; setBusy(false); syncBaseButtons(); updateFileBadges(); showInfo(); refresh();
    status(`片基模式：${BASE_LABELS[bm]}`);
  } catch (e) { setBusy(false); syncBaseButtons(); status("片基切换失败：" + e.message, true); }
}
$("bAutoBase").onclick = () => switchBaseMode("auto");
$("bRollDQ").onclick = () => switchBaseMode("roll_dq");
$("bRollB1").onclick = () => switchBaseMode("roll_b1");
$("film").onchange = () => { const on = document.querySelector(".f.on"); if (on) openFile(on.dataset.rel, on); };
$("bExport").onclick = async () => {
  if (!meta) return; status("导出全分辨率 16 位 TIFF……");
  try {
    const p = {}; for (const k in NAMES) p[k] = params[k];
    const j = await api("/api/export", {params:p, encoding:"srgb", token:tok()});
    $("exp").style.display = "block";
    $("exp").innerHTML = `已导出（不会覆盖已有文件）：${j.path}<br>sidecar：${j.sidecar}<br>质量检查：<span class="${j.qc.status === "pass" ? "" : "warn"}">${j.qc.status}</span>` +
      j.qc.failing.map(c => `<br>· ${c.name}：${c.status}`).join("");
    status("导出完成");
  } catch (e) { status("导出失败：" + e.message, true); }
};
window.onresize = drawOverlay;
loadFiles().catch(e => status(e.message, true));
</script>
</body>
</html>
